  /api/v1/console/recovery:
    post:
      operationId: post_api_v1_console_recovery
      summary: POST /api/v1/console/recovery
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          csrf_token:
                            type: string
                          expires_at:
                            type: string
                            format: date-time
                          repair_only:
                            type: boolean
                          settings_version:
                            type: integer
                            format: int64
                          security:
                            type: object
                            properties:
                              turnstile_site_key:
                                type: string
                              turnstile_enabled:
                                type: boolean
                              turnstile_secret_configured:
                                type: boolean
                            required:
                              - turnstile_site_key
                              - turnstile_enabled
                              - turnstile_secret_configured
                            additionalProperties: false
                        required:
                          - csrf_token
                          - expires_at
                          - repair_only
                          - settings_version
                          - security
                        additionalProperties: false
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
        - name: Origin
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recovery_code:
                  type: string
              required:
                - recovery_code
