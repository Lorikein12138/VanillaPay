      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MerchantCallbackSettings'
    MerchantTestPaymentResponse:
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MerchantTestPayment'
    MerchantNotifyDomainsResponse:
      description: 当前回调域名白名单，默认关闭
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MerchantNotifyDomains'
    Error503:
      description: 请求失败；error.code 使用 ErrorCode 枚举
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RouteNotFound:
      description: 未知 API 路由
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                      - NOT_FOUND
                required:
                  - code
                additionalProperties: false
            required:
              - error
            additionalProperties: false
    UnmatchedRoute:
      description: 未注册的路径或方法；路由层拒绝，不是 API operation
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - NOT_FOUND
                    required:
                      - code
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
              - $ref: '#/components/schemas/ErrorEnvelope'
        text/plain:
          schema:
            type: string
    MethodNotAllowed:
      description: chi 路由层拒绝未注册方法；无响应体
      content:
        text/plain:
          schema:
            type: string
            maxLength: 0
