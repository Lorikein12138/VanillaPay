openapi: 3.0.3
info:
  title: VanillaPay API
  version: 1.0.0
  description: >-
    接口契约的唯一来源。网站 API 使用 data/error/request_id 信封；成功包含 error:null，错误不包含 data。支付兼容协议、健康检查和媒体流采用各自明确的响应结构。仅不描述
    /、/api、/api/* 三个页面/404 兜底入口。
paths:
  /api/v1/console/bootstrap-status:
    get:
      operationId: get_api_v1_console_bootstrap_status
      summary: GET /api/v1/console/bootstrap-status
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          initialized:
                            type: boolean
                          turnstile_enabled:
                            type: boolean
                        required:
                          - initialized
                          - turnstile_enabled
                        additionalProperties: false
        '500':
          $ref: '#/components/responses/Error500'
  /api/v1/console/bootstrap:
    post:
      operationId: post_api_v1_console_bootstrap
      summary: POST /api/v1/console/bootstrap
      security: []
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthSessionResult'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthBootstrapRequest'
  /api/v1/auth/login:
    post:
      operationId: post_api_v1_auth_login
      summary: POST /api/v1/auth/login
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/AuthSessionResult'
                          - $ref: '#/components/schemas/AuthLoginResult'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
  /api/v1/auth/second-factor:
