        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
        - name: Origin
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthEmailCodeRequest'
            examples:
              authenticated:
                value:
                  purpose: change_password
                  email: merchant@example.test
      description: >-
        register/reset_password 为公开请求，需要 Turnstile；其余 purpose 需要商户会话和 CSRF。reset_password 通过公开校验后始终返回同一 200
        响应，冷却不发信，投递由既有队列重试。
