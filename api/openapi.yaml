  /api.php:
    get:
      operationId: get_api_php
      summary: GET /api.php
      security:
        - PaymentV1Key: []
      responses:
        '200':
          description: 协议结果；业务失败亦使用 HTTP 200
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/V1Order'
                  - $ref: '#/components/schemas/V1Refund'
                  - $ref: '#/components/schemas/V1MerchantInfo'
                  - $ref: '#/components/schemas/V1MerchantOrders'
                  - $ref: '#/components/schemas/ProtocolError'
      parameters:
        - name: pid
          in: query
          required: true
          schema:
            type: string
        - name: key
          in: query
          required: true
          schema:
            type: string
            writeOnly: true
        - name: sign
          in: query
          required: false
          schema:
            type: string
        - name: sign_type
          in: query
          required: false
          schema:
            type: string
        - name: act
          in: query
          required: true
          schema:
            type: string
            enum:
              - order
              - refund
              - query
              - orders
        - name: trade_no
          in: query
          required: false
          schema:
            type: string
        - name: out_trade_no
          in: query
          required: false
          schema:
            type: string
        - name: money
          in: query
          required: false
          schema:
            type: string
        - name: out_refund_no
          in: query
          required: false
          schema:
            type: string
        - name: reason
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
            default: 10
            description: 超过 50 按 50 处理。
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
            maximum: 10000
        - name: status
          in: query
          schema:
            type: integer
            minimum: 0
            enum: [0, 1, 2]
            description: 0 为待支付或已过期，1 为已支付，2 为已退款。
      description: V1 商户协议，key 必填，提供 sign 时也校验 MD5。act=order 查单，act=refund 请求退款，act=query 查询商户和订单统计，act=orders 分页查询外部订单，count 为符合筛选条件的总数。
    post:
      operationId: post_api_php
      summary: POST /api.php
      security:
        - PaymentV1Key: []
      responses:
        '200':
          description: 协议结果；业务失败亦使用 HTTP 200
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/V1Order'
                  - $ref: '#/components/schemas/V1Refund'
                  - $ref: '#/components/schemas/V1MerchantInfo'
                  - $ref: '#/components/schemas/V1MerchantOrders'
                  - $ref: '#/components/schemas/ProtocolError'
      description: V1 商户协议，key 必填，提供 sign 时也校验 MD5。act=order 查单，act=refund 请求退款，act=query 查询商户和订单统计，act=orders 分页查询外部订单。兼容易支付客户端在查询串与表单中重复发送同一参数：同名参数两处值相同视为一个参数，值不同返回 INVALID_SIGNATURE。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/V1ActionForm'
