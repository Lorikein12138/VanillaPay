components:
  securitySchemes:
    MerchantSession:
      type: apiKey
      in: cookie
      name: __Host-vp_merchant
      description: 商户会话；production 使用 __Host- 前缀和 Secure/HttpOnly/SameSite=Lax，development 使用 vp_merchant。
    AdminSession:
      type: apiKey
      in: cookie
      name: __Host-vp_console
      description: 管理员会话；production 使用 __Host- 前缀和 Secure/HttpOnly/SameSite=Lax，development 使用 vp_console。
    RecoverySession:
      type: apiKey
      in: cookie
      name: __Host-vp_recovery
      description: 一次性修复会话，仅允许 PUT /console/settings/security；SameSite=Strict。
    CSRF:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 会话写操作同时校验 token 与同源 Origin。
    DeviceToken:
      type: http
      scheme: bearer
      description: 绑定设备独有的 token，仅用于 heartbeat/receipts。
    PaymentV1Signature:
      type: apiKey
      in: query
      name: sign
      description: MD5：过滤空值及 sign/sign_type，按参数名排序 key=value 以 & 连接，再拼接商户 key。POST 时 sign 位于表单。
    PaymentV1Key:
      type: apiKey
      in: query
      name: key
      description: V1 查询/退款的商户 key；POST 时位于表单。可额外附上 MD5 sign。
    PaymentV2Signature:
      type: apiKey
      in: query
      name: sign
      description: RSA-SHA256 签名；sign_type=RSA，签名经 Base64 编码，包含 timestamp。POST 时位于表单。
    MediaSignature:
      type: apiKey
      in: query
      name: signature
      description: 收银台二维码访问签名；同时需要 trade_no 与 expires。
  responses:
    Error400:
      description: 请求失败；error.code 使用 ErrorCode 枚举
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error401:
      description: 请求失败；error.code 使用 ErrorCode 枚举
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error403:
      description: 请求失败；error.code 使用 ErrorCode 枚举
