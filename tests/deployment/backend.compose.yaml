services:
  network-fixture:
    build:
      context: ../..
      dockerfile: tests/deployment/network.Dockerfile
    image: ${NETWORK_FIXTURE_IMAGE:?NETWORK_FIXTURE_IMAGE must be unique to this run}
    command:
      - serve
      - --state-dir
      - /run/fixtures
      - --state-file
      - /run/fixtures/state.json
      - --email-code-file
      - /run/fixtures/last-email-code
    labels:
      com.vanillapay.smoke.run-id: ${SMOKE_RUN_ID:?SMOKE_RUN_ID is required}
    cap_add:
      - NET_ADMIN
    extra_hosts:
      - callback.vp.test:93.184.216.34
      - challenges.cloudflare.com:93.184.216.35
      - smtp.vp.test:93.184.216.36
    volumes:
      - fixtures:/run/fixtures
      - ${ROOT_BUNDLE_FILE:?ROOT_BUNDLE_FILE is required}:/run/input/root-bundle.pem:ro
    networks:
      backend-internal:
        aliases:
          - network-fixture
        ipv4_address: ${FIXTURE_IP:?FIXTURE_IP is required}
    healthcheck:
      test: ["CMD", "/usr/local/bin/network-fixture", "status", "--state-file", "/run/fixtures/state.json"]
      interval: 2s
      timeout: 2s
      retries: 20

  app:
    image: ${APP_IMAGE:?APP_IMAGE must identify this run's production build}
    build:
      context: ../..
      dockerfile: Dockerfile
    labels:
      com.vanillapay.smoke.run-id: ${SMOKE_RUN_ID:?SMOKE_RUN_ID is required}
    network_mode: service:network-fixture
    ports: []
    networks: []
    depends_on:
      network-fixture:
        condition: service_healthy
      test-db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: ${TEST_DATABASE_URL:?TEST_DATABASE_URL must point to an isolated external database}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must use this run's local TLS ingress}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY must be a one-run secret}
      LISTEN_ADDR: :8080
      DATA_DIR: /var/lib/vanillapay
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?TRUSTED_PROXY_CIDRS is required}
      SSL_CERT_FILE: /run/fixtures/ca-bundle.pem
    volumes:
      - app-data:/var/lib/vanillapay
      - fixtures:/run/fixtures:ro
    user: 65532:65532
    cap_drop:
      - ALL
    stop_grace_period: 30s

  test-db:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must be pinned by digest}
    labels:
      com.vanillapay.smoke.run-id: ${SMOKE_RUN_ID:?SMOKE_RUN_ID is required}
    environment:
      POSTGRES_DB: vanillapay
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - backend-internal
    volumes:
      - db-data:/var/lib/postgresql/data

  nginx-test:
    image: ${NGINX_IMAGE:?NGINX_IMAGE must be pinned by digest}
    volumes:
      - ${NGINX_CONFIG:?NGINX_CONFIG is required}:/etc/nginx/conf.d/default.conf:ro
      - fixtures:/run/fixtures:ro
    labels:
      com.vanillapay.smoke.run-id: ${SMOKE_RUN_ID:?SMOKE_RUN_ID is required}
    ports:
      - "127.0.0.1:${HTTP_PORT:?HTTP_PORT is required}:80"
      - "127.0.0.1:${HTTPS_PORT:?HTTPS_PORT is required}:443"
    networks:
      backend-internal:
        ipv4_address: ${NGINX_INTERNAL_IP:?NGINX_INTERNAL_IP is required}
      ingress: {}
networks:
  backend-internal:
    internal: true
    labels:
      com.vanillapay.smoke.run-id: ${SMOKE_RUN_ID:?SMOKE_RUN_ID is required}
    ipam:
      config:
        - subnet: ${SMOKE_SUBNET:?SMOKE_SUBNET is required}
  ingress:
    labels:
      com.vanillapay.smoke.run-id: ${SMOKE_RUN_ID:?SMOKE_RUN_ID is required}

volumes:
  fixtures:
    labels:
      com.vanillapay.smoke.run-id: ${SMOKE_RUN_ID:?SMOKE_RUN_ID is required}
  app-data:
    labels:
      com.vanillapay.smoke.run-id: ${SMOKE_RUN_ID:?SMOKE_RUN_ID is required}
  db-data:
    labels:
      com.vanillapay.smoke.run-id: ${SMOKE_RUN_ID:?SMOKE_RUN_ID is required}
