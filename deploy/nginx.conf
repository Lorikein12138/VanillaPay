upstream vanillapay_app {
    # APP_PORT controls only the local diagnostic port (default 127.0.0.1:8080).
    # Use this restricted socket for ingress so direct TCP cannot spoof client IPs.
    server unix:/var/lib/vanillapay-proxy/app.sock;
    keepalive 32;
}

server {
    listen 80;
    server_name pay.lorikein.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/vanillapay-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://pay.lorikein.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name pay.lorikein.cn;

    ssl_certificate /etc/letsencrypt/live/pay.lorikein.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay.lorikein.cn/privkey.pem;

    # 5 MiB file + 64 KiB multipart overhead, matching the app upload limit.
    client_max_body_size 5184k;

    location / {
        proxy_pass http://vanillapay_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
