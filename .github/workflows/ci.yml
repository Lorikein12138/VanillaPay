name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: vanillapay_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vanillapay_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/vanillapay_ci?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: go.sum
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: ./...
      # NewDatabase isolates schemas; five consecutive local shuffled runs passed.
      # Shuffle test order and disable result caching on every PostgreSQL-backed run.
      - run: go test -count=1 -shuffle=on ./...

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Check API types are up to date
        working-directory: .
        run: |
          npm --prefix web run api:generate
          git diff --exit-code -- web/src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: vanillapay_e2e
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vanillapay_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: development
      DATABASE_URL: postgres://postgres@localhost:5432/vanillapay_e2e?sslmode=disable
      PUBLIC_BASE_URL: http://localhost:8080
      LISTEN_ADDR: localhost:8080
      DATA_DIR: .local/ci-e2e-data
      TRUSTED_PROXY_CIDRS: ''
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Build and start backend
        shell: bash
        run: |
          mkdir -p .local "$DATA_DIR"
          encryption_key="$(openssl rand -base64 32)"
          echo "::add-mask::$encryption_key"
          export APP_ENCRYPTION_KEY="$encryption_key"
          go build -o .local/server ./tests/e2e/server
          .local/server > .local/server.log 2>&1 &
          echo "$!" > .local/server.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/health/ready > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat .local/server.pid)" 2>/dev/null; then
              echo 'Backend exited before readiness'
              exit 1
            fi
            sleep 1
          done
          echo 'Backend readiness timed out'
          exit 1
      - run: npm run e2e
        working-directory: web
      - name: Stop backend
        if: always()
        shell: bash
        run: |
          if [ -f .local/server.pid ]; then
            kill "$(cat .local/server.pid)" 2>/dev/null || true
          fi
