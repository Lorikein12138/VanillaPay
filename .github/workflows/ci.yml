name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: vanillapay_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vanillapay_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/vanillapay_ci?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate production Compose
        # The console recovery page tells operators to run `docker exec vanillapay ...`.
        run: |
          docker compose config --quiet
          test "$(docker compose config --format json | jq -r '.services.app.container_name')" = vanillapay
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: go.sum
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: ./...
      # NewDatabase isolates schemas; five consecutive local shuffled runs passed.
      # Shuffle test order and disable result caching on every PostgreSQL-backed run.
      - run: go test -count=1 -shuffle=on ./...

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Check API types are up to date
        working-directory: .
        run: |
          npm --prefix web run api:generate
          git diff --exit-code -- web/src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f # v1.64.1-noble
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: vanillapay_e2e
        options: >-
          --health-cmd "pg_isready -U postgres -d vanillapay_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: development
      DATABASE_URL: postgres://postgres@postgres:5432/vanillapay_e2e?sslmode=disable
      PUBLIC_BASE_URL: http://localhost:8080
      LISTEN_ADDR: localhost:8080
      DATA_DIR: .local/ci-e2e-data
      DOWNLOADS_DIR: .local/ci-e2e-downloads
      TRUSTED_PROXY_CIDRS: ''
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Verify Playwright image version
        working-directory: web
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const expected = require('./package.json').devDependencies['@playwright/test'];
          const installed = require('@playwright/test/package.json').version;
          const image = JSON.parse(fs.readFileSync('/ms-playwright/.docker-info', 'utf8'));
          if (image.driverVersion !== expected || installed !== expected) {
            console.error(`Playwright version mismatch: package.json=${expected}, installed=${installed}, image=${image.driverVersion}. Update the e2e container tag and digest in .github/workflows/ci.yml together with @playwright/test.`);
            process.exit(1);
          }
          fs.accessSync(require('@playwright/test').chromium.executablePath(), fs.constants.X_OK);
          console.log(`Playwright ${expected}: image version and Chromium executable verified`);
          NODE
      - run: npm run build
        working-directory: web
      - name: Build and start backend
        shell: bash
        run: |
          mkdir -p .local "$DATA_DIR" "$DOWNLOADS_DIR"
          apk="$DOWNLOADS_DIR/vanillapay-monitor-1.0.0.apk"
          printf 'VanillaPay test download\n' > "$apk"
          bash scripts/download-manifest.sh "$apk" 2026-11-09T00:00:00Z > "$DOWNLOADS_DIR/latest.json"
          encryption_key="$(openssl rand -base64 32)"
          echo "::add-mask::$encryption_key"
          export APP_ENCRYPTION_KEY="$encryption_key"
          # Checkout's temporary safe.directory config is not inherited by this root process.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go build -o .local/server ./tests/e2e/server
          .local/server > .local/server.log 2>&1 &
          echo "$!" > .local/server.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/health/ready > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat .local/server.pid)" 2>/dev/null; then
              echo 'Backend exited before readiness'
              exit 1
            fi
            sleep 1
          done
          echo 'Backend readiness timed out'
          exit 1
      - run: npm run e2e
        working-directory: web
      - name: Stop backend
        if: always()
        shell: bash
        run: |
          if [ -f .local/server.pid ]; then
            kill "$(cat .local/server.pid)" 2>/dev/null || true
          fi

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Check preinstalled Android SDK
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -f "$sdk/platforms/android-37.0/android.jar" || { echo 'Android SDK platform 37.0 is required'; exit 1; }
          test -x "$sdk/build-tools/36.0.0/aapt2" || { echo 'Android SDK build-tools 36.0.0 are required'; exit 1; }
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
      - run: ./gradlew lint testDebugUnitTest assembleDebug
      - run: ./gradlew testDebugUnitTest -PmonitorScreenshots --tests '*MonitorScreenshotTest'
      - name: Check screenshot outputs
        run: test "$(find ../.artifacts/android-screens -name '*.png' -size +0c | wc -l)" -eq 32

  # Rehearses the release workflow without its secrets: a release APK signed with a
  # throwaway key, the image built from it exactly as release.yml does (not pushed),
  # then the image migrates a fresh database and serves the app and the download.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: vanillapay_image
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vanillapay_image"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build release APK with a throwaway key
        id: apk
        working-directory: android
        shell: bash
        run: |
          sdk=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          apksigner="$sdk/build-tools/36.0.0/apksigner"
          test -f "$sdk/platforms/android-37.0/android.jar"
          test -x "$apksigner"
          export ANDROID_HOME="$sdk"

          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/ci-signing.XXXXXXXX")
          trap 'rm -rf -- "$signing_dir"' EXIT
          export VANILLAPAY_KEYSTORE_PATH="$signing_dir/ci.keystore"
          export VANILLAPAY_KEY_ALIAS=ci
          VANILLAPAY_KEYSTORE_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$VANILLAPAY_KEYSTORE_PASSWORD"
          export VANILLAPAY_KEYSTORE_PASSWORD VANILLAPAY_KEY_PASSWORD=$VANILLAPAY_KEYSTORE_PASSWORD
          keytool -genkeypair -keystore "$VANILLAPAY_KEYSTORE_PATH" -storetype PKCS12 \
            -storepass:env VANILLAPAY_KEYSTORE_PASSWORD -keypass:env VANILLAPAY_KEY_PASSWORD \
            -alias ci -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=VanillaPay CI'
          expected=$(keytool -exportcert -keystore "$VANILLAPAY_KEYSTORE_PATH" -alias ci \
            -storepass:env VANILLAPAY_KEYSTORE_PASSWORD | sha256sum | cut -d' ' -f1)
          ./gradlew assembleRelease -PvanillapayBaseUrl=https://pay.lorikein.com

          shopt -s nullglob
          apks=(app/build/outputs/apk/release/vanillapay-monitor-*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo 'Expected one release APK' >&2
            exit 1
          fi
          apk=${apks[0]}
          actual=$("$apksigner" verify --print-certs "$apk" |
            awk -F ': ' '/^Signer #[0-9]+ certificate SHA-256 digest:/ { print tolower($2) }')
          if [[ $actual != "$expected" ]]; then
            echo 'Release APK is not signed with the configured key' >&2
            exit 1
          fi
          context="$RUNNER_TEMP/vanillapay-release"
          version=$(bash ../scripts/release-context.sh "$apk" "$context")
          {
            echo "version=$version"
            echo "context=$context"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build release image
        env:
          APK_VERSION: ${{ steps.apk.outputs.version }}
          DOWNLOAD_CONTEXT: ${{ steps.apk.outputs.context }}
        run: |
          docker buildx build --platform linux/amd64 \
            --build-context "monitor-downloads=$DOWNLOAD_CONTEXT" \
            --label "org.opencontainers.image.version=$APK_VERSION" \
            --load --tag vanillapay:ci .
      - name: Migrate and serve from the image
        env:
          DOWNLOAD_CONTEXT: ${{ steps.apk.outputs.context }}
        shell: bash
        run: |
          encryption_key=$(openssl rand -base64 32)
          echo "::add-mask::$encryption_key"
          # Same entrypoint and network layout as compose.yaml.
          docker run -d --name vanillapay-ci --network host \
            -e APP_ENV=production \
            -e PUBLIC_BASE_URL=https://pay.example.com \
            -e LISTEN_ADDR=127.0.0.1:18080 \
            -e TRUSTED_PROXY_CIDRS=127.0.0.1/32 \
            -e DATABASE_URL='postgres://postgres@127.0.0.1:5432/vanillapay_image?sslmode=disable' \
            -e APP_ENCRYPTION_KEY="$encryption_key" \
            --entrypoint /bin/bash vanillapay:ci -ec 'server migrate up && exec server serve'
          base=http://127.0.0.1:18080
          for attempt in {1..60}; do
            if curl --fail --silent "$base/health/ready" > /dev/null; then
              break
            fi
            if [[ $(docker inspect -f '{{.State.Running}}' vanillapay-ci) != true || $attempt == 60 ]]; then
              docker logs vanillapay-ci
              echo 'Image did not become ready' >&2
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent "$base/" | grep -q '<div id="root">'
          curl --fail --silent --output /dev/null "$base/favicon.ico"
          manifest=$(curl --fail --silent "$base/downloads/latest.json")
          diff <(jq -S . <<< "$manifest") <(jq -S . "$DOWNLOAD_CONTEXT/downloads/latest.json")
          file=$(jq -er .file <<< "$manifest")
          sha=$(curl --fail --silent "$base/downloads/$file" | sha256sum | cut -d' ' -f1)
          test "$sha" = "$(jq -er .sha256 <<< "$manifest")"
          echo "Image serves the app and $file"
      - name: Stop image
        if: always()
        run: docker rm -f -v vanillapay-ci > /dev/null 2>&1 || true
