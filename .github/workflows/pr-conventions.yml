name: PR 规范检查

# 只在向 master 提 PR 时运行，不监听 push，避免同一次推送触发两次。
# edited 不按「标题是否变化」跳过：被跳过的 job 会被当作通过，可能盖掉之前的失败结果。
on:
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-conventions:
    name: pr-conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 检查分支名、PR 标题与 commit
        env:
          BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: python
        run: |
          import os, re, subprocess, sys

          TYPES = "feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert"
          BRANCH_RE = re.compile(rf"^({TYPES})/[a-z0-9][a-z0-9._-]*$")
          TITLE_RE = re.compile(rf"^({TYPES})\([^()\s]+\): (\S.*)$")
          HAN_RE = re.compile(r"[一-鿿]")
          errors = []

          def check_title(label, title):
              m = TITLE_RE.match(title)
              if not m:
                  errors.append(f"{label}不符合「类型(范围): 中文描述」：{title}")
              elif not HAN_RE.search(m.group(2)):
                  errors.append(f"{label}的描述里没有中文：{title}")

          branch = os.environ["BRANCH"]
          if not BRANCH_RE.match(branch):
              errors.append(f"分支名不符合「类型/小写描述」：{branch}")
          check_title("PR 标题", os.environ["PR_TITLE"])

          log = subprocess.run(
              ["git", "log", "--format=%h%x00%s%x00%b%x1e",
               f"{os.environ['BASE_SHA']}..{os.environ['HEAD_SHA']}"],
              check=True, capture_output=True, text=True, encoding="utf-8",
          ).stdout
          for entry in filter(None, (e.strip("\n") for e in log.split("\x1e"))):
              sha, subject, body = entry.split("\x00")
              check_title(f"commit {sha} 的标题", subject)
              if body.strip():
                  errors.append(f"commit {sha} 只能写标题，不能有正文")

          for e in errors:
              print(f"::error::{e}")
          if errors:
              sys.exit(1)
          print("分支名、PR 标题和所有 commit 均符合规范")
