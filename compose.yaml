name: vanillapay

# 更新：docker compose pull app，然后 docker compose up -d --force-recreate app。
# 回滚：将 latest 改为 sha-xxxxxxx 后按更新步骤操作。迁移只前进，跨迁移回滚须恢复对应数据库备份。
# 宿主机 nginx 反代至 http://127.0.0.1:18080，覆盖 X-Real-IP（$remote_addr），
# 追加 X-Forwarded-For（$proxy_add_x_forwarded_for），并设置 X-Forwarded-Proto（$scheme）。
# 宿主机负责定时备份 PostgreSQL 和 /data/docker/vanillapay/data。
services:
  app:
    # 将 replace-me 换成 Docker Hub 命名空间。
    image: docker.io/replace-me/vanillapay:latest
    pull_policy: always
    container_name: vanillapay
    network_mode: host
    init: true
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-ec", "server migrate up && exec server serve"]
    environment:
      # 生产模式。
      APP_ENV: production
      # 只监听宿主机回环地址。
      LISTEN_ADDR: 127.0.0.1:18080
      # 容器内数据目录，与下方挂载目标一致。
      DATA_DIR: /var/lib/vanillapay
      # 仅信任从回环地址连接的宿主机反代。
      TRUSTED_PROXY_CIDRS: 127.0.0.1/32
      # 替换为站点的公开 HTTPS 地址。
      PUBLIC_BASE_URL: https://pay.example.com
      # 填写宿主机 PostgreSQL 连接串，凭据中的特殊字符需做 URL 编码。
      DATABASE_URL: postgres://vanillapay@127.0.0.1:5432/vanillapay?sslmode=disable
      # 填写 Base64 编码的 32 字节加密密钥，并与备份分开保管。
      APP_ENCRYPTION_KEY: "<应用加密密钥>"
    volumes:
      # 由宿主机预建并授权给 UID/GID 65532。
      - /data/docker/vanillapay/data:/var/lib/vanillapay
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/18080
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r protocol status remainder <&3
          [[ $$protocol == HTTP/1.* && $$status == 200 ]]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
