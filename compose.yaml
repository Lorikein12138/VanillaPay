services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vanillapay:local
    init: true
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env}
      LISTEN_ADDR: :8080
      DATA_DIR: /var/lib/vanillapay
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - app-data:/var/lib/vanillapay
    stop_grace_period: 30s

volumes:
  app-data:
