version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bidichk
    - copyloopvar
    - durationcheck
    - errorlint
    - misspell
    - nilerr
    - nolintlint
    - sqlclosecheck
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
